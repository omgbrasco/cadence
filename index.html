<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0B10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0A0B10; --ink:#F5F6F8; --ink-soft:#C7CAD1; --ink-dim:#9296A0;
    --glass:rgba(255,255,255,.075); --glass-2:rgba(255,255,255,.12); --glass-border:rgba(255,255,255,.16);
    --pine:#3FE0B8; --brass:#FFB454; --clay:#FF6E6A; --blue:#6FA8FF;
    --radius:24px; --radius-sm:16px; --tap:48px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;font-weight:500;-webkit-font-smoothing:antialiased;min-height:100vh}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none;padding:0;min-height:var(--tap)}
  :focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* soft glowing blobs behind everything, purely decorative */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
  .bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35}
  .bg i:nth-child(1){width:420px;height:420px;top:-140px;left:-100px;background:var(--pine)}
  .bg i:nth-child(2){width:380px;height:380px;top:20%;right:-140px;background:var(--blue)}
  .bg i:nth-child(3){width:360px;height:360px;bottom:-120px;left:10%;background:var(--brass)}

  .wrap{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}

  .masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .title{font-family:var(--serif);font-size:32px;line-height:1;margin:0;font-weight:700}
  .date{font-size:14px;color:var(--ink-soft);text-align:right}

  .panel{background:var(--glass);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
    border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;
    box-shadow:0 10px 34px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.10)}
  .panel + .panel{margin-top:14px}
  h2{font-family:var(--serif);font-size:22px;margin:0 0 3px;font-weight:700}
  .lede{color:var(--ink-soft);font-size:15px;margin:0 0 14px}

  /* stat tiles */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .stat{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:14px;backdrop-filter:blur(30px)}
  .stat b{font-family:var(--serif);font-size:30px;font-weight:700;display:block;line-height:1.1}
  .stat span{font-size:13px;color:var(--ink-soft)}

  /* cadence chip strip */
  .chiprail{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
  .chiprail::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--glass);border:1px solid var(--glass-border);border-radius:99px;padding:10px 16px;
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:108px}
  .chip[aria-current="true"]{background:var(--glass-2);border-color:rgba(255,255,255,.32)}
  .chip .cl{font-size:14px;font-weight:600}
  .chip .cp{font-family:var(--serif);font-size:17px;color:var(--pine)}

  /* routine rows */
  .rt{border-radius:var(--radius-sm);margin:0 -6px}
  .rthead{display:flex;align-items:center;gap:12px;padding:12px 6px}
  .tick{width:40px;height:40px;flex:0 0 40px;border:2px solid rgba(255,255,255,.4);border-radius:50%;display:grid;place-items:center;
    font-family:var(--serif);font-size:15px;font-weight:700;background:rgba(255,255,255,.04)}
  .tick.done{background:var(--pine);border-color:var(--pine);color:#082019}
  .tick.part{border-color:var(--brass);color:var(--brass)}
  .rtb{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px}
  .rtn{font-size:17px;font-weight:600}
  .rt.done .rtn{color:var(--ink-soft);text-decoration:line-through}
  .rtm{font-size:13.5px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .chev{width:22px;height:22px;flex:0 0 auto;color:var(--ink-dim);transition:transform .15s}
  .rt.open .chev{transform:rotate(180deg)}
  .hist{display:flex;gap:3px}
  .hist span{width:11px;height:11px;background:rgba(255,255,255,.14);border-radius:3px}
  .hist span.on{background:var(--pine)}
  .hist span.half{background:var(--brass)}
  .det{margin:2px 6px 10px;padding:14px;background:rgba(0,0,0,.22);border-radius:var(--radius-sm);font-size:15px}
  .det img{max-width:100%;border-radius:12px;margin-top:10px;display:block}
  .det a{color:var(--pine)}
  .stepper{display:flex;align-items:center;gap:14px;margin:8px 0}
  .stepbtn{width:40px;height:40px;border-radius:50%;background:var(--glass-2);border:1px solid var(--glass-border);font-size:20px;font-weight:700;display:grid;place-items:center}
  .steplabel{font-family:var(--serif);font-size:18px;min-width:56px;text-align:center}

  .field{display:block;margin-bottom:12px}
  .field span{display:block;font-size:14px;color:var(--ink-soft);margin-bottom:5px;font-weight:600}
  input,select,textarea{width:100%;padding:12px 13px;background:rgba(0,0,0,.28);border:1px solid var(--glass-border);border-radius:var(--radius-sm);font-size:16px}
  textarea{min-height:80px;resize:vertical;font-family:var(--sans)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .btn{padding:14px 20px;background:var(--ink);color:#0A0B10;border-radius:99px;font-size:16px;font-weight:700;text-align:center}
  .btn.big{width:100%;padding:17px 20px;font-size:17px}
  .btn.ghost{background:var(--glass-2);color:var(--ink);border:1px solid var(--glass-border);font-weight:600}
  .btn.warn{background:var(--clay);color:#2a0906}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

  .seg{display:flex;gap:6px;background:rgba(0,0,0,.22);border-radius:99px;padding:4px;margin-bottom:16px}
  .segbtn{flex:1;padding:10px 8px;border-radius:99px;font-size:14.5px;font-weight:600;color:var(--ink-soft);text-align:center}
  .segbtn[aria-pressed="true"]{background:var(--glass-2);color:var(--ink)}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:12.5px;border-bottom:1px solid var(--glass-border);padding:0 6px 7px 0}
  td{padding:8px 6px 8px 0;border-bottom:1px solid var(--glass-border)}
  .empty{color:var(--ink-soft);font-size:15px;padding:16px 0}
  .tagbtn{font-size:14px;padding:8px 14px;border:1px solid var(--glass-border);border-radius:99px;font-weight:600}
  .tagbtn[aria-pressed="true"]{background:var(--glass-2)}
  .goal{border-top:1px solid var(--glass-border);padding:14px 0}
  .goal:first-of-type{border-top:none}
  .bar{height:9px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--brass)}
  .note{white-space:pre-wrap}
  .toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:var(--glass-2);backdrop-filter:blur(20px);border:1px solid var(--glass-border);color:var(--ink);
    padding:10px 18px;border-radius:99px;font-size:14.5px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
  .toast.on{opacity:1}
  .hr{border:none;border-top:1px solid var(--glass-border);margin:18px 0}
  code{background:rgba(0,0,0,.3);padding:2px 6px;border-radius:6px;font-size:14px}
  .pill{display:inline-block;font-size:12.5px;padding:4px 11px;border-radius:99px;border:1px solid var(--glass-border);color:var(--ink-soft);font-weight:600}
  .pill.live{border-color:var(--pine);color:var(--pine)}
  .pill.off{border-color:var(--clay);color:var(--clay)}

  /* bottom tab bar */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
    background:rgba(14,16,22,.62);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
    border-top:1px solid var(--glass-border);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .tabbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 16px;border-radius:16px;color:var(--ink-dim);min-width:64px}
  .tabbtn[aria-selected="true"]{color:var(--ink);background:var(--glass-2)}
  .tabbtn svg{width:24px;height:24px}
  .tabbtn span{font-size:11.5px;font-weight:700}
  .tabdot{position:absolute;top:4px;right:16px;width:9px;height:9px;border-radius:50%;background:var(--clay);border:2px solid #0E1016}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="masthead">
    <h1 class="title">Cadence</h1>
    <div class="date"><span id="today"></span><br><span id="syncpill" class="pill">local only</span></div>
  </div>
  <div id="view"></div>
</div>
<div class="tabbar" role="tablist" id="tabs"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ constants ============ */
const CAD=[
 {id:'daily',label:'Daily',short:'day',rrule:'FREQ=DAILY'},
 {id:'weekly',label:'Weekly',short:'week',rrule:'FREQ=WEEKLY'},
 {id:'biweekly',label:'Every 2 weeks',short:'fortnight',rrule:'FREQ=WEEKLY;INTERVAL=2'},
 {id:'monthly',label:'Monthly',short:'month',rrule:'FREQ=MONTHLY'},
 {id:'quarterly',label:'Every 3 months',short:'quarter',rrule:'FREQ=MONTHLY;INTERVAL=3'},
 {id:'semiannual',label:'Every 6 months',short:'half-year',rrule:'FREQ=MONTHLY;INTERVAL=6'},
 {id:'yearly',label:'Yearly',short:'year',rrule:'FREQ=YEARLY'}];
const CATS={body:'#FF6E6A',mind:'#3FE0B8',home:'#FFB454',work:'#6FA8FF',money:'#C7A6FF',people:'#9BD15A',craft:'#4FD0E0'};
const METRICS=[['steps','Steps'],['sleep','Sleep (h)'],['rhr','Resting HR'],['workouts','Workouts'],['weight','Weight'],['mood','Mood 1-5'],['energy','Energy 1-5']];
const KEY='cadence-state-v3', TKEY='cadence-token', GKEY='cadence-gist', FBKEY='cadence-feedback-v1', RPTSEENKEY='cadence-report-seen';
const ICONS={
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',
  routines:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg>',
  insights:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>',
  feedback:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
};

let S={routines:[],logs:{},metrics:{},goals:[],journal:[],updated:0,v:3};
let FB={entries:[],updated:0}, RPT={reports:[]};
let tab='today', cad='daily', open={}, editingId=null, insSub='signals', ready=false, timers=[];

/* ============ device storage (works hosted and inside Claude) ============ */
const local={
  get(k){ try{return localStorage.getItem(k);}catch(e){return null;} },
  set(k,v){ try{localStorage.setItem(k,v);}catch(e){} },
  del(k){ try{localStorage.removeItem(k);}catch(e){} }
};
async function readLocal(){
  const s=local.get(KEY); if(s)return s;
  if(window.storage){ try{const r=await window.storage.get(KEY); return r&&r.value;}catch(e){} }
  return null;
}
async function writeLocal(s){
  local.set(KEY,s);
  if(window.storage){ try{await window.storage.set(KEY,s);}catch(e){} }
}

/* ============ period math ============ */
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const pad=n=>String(n).padStart(2,'0');
function periodKey(c,d){
  const y=d.getFullYear();
  if(c==='daily')return iso(d);
  if(c==='weekly'){const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return t.getFullYear()+'-W'+pad(1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7));}
  if(c==='biweekly')return 'B'+Math.floor((Date.UTC(y,d.getMonth(),d.getDate())-Date.UTC(1970,0,5))/864e5/14);
  if(c==='monthly')return y+'-'+pad(d.getMonth()+1);
  if(c==='quarterly')return y+'-Q'+(Math.floor(d.getMonth()/3)+1);
  if(c==='semiannual')return y+'-H'+(d.getMonth()<6?1:2);
  return String(y);
}
const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
function shift(c,d,n){const x=new Date(d);
  if(c==='daily')x.setDate(x.getDate()+n);
  else if(c==='weekly')x.setDate(x.getDate()+7*n);
  else if(c==='biweekly')x.setDate(x.getDate()+14*n);
  else if(c==='monthly'||c==='quarterly'||c==='semiannual'){
    const step=c==='monthly'?1:c==='quarterly'?3:6, day=x.getDate();
    x.setDate(1); x.setMonth(x.getMonth()+step*n);
    x.setDate(Math.min(day,daysInMonth(x.getFullYear(),x.getMonth())));
  } else {
    const day=x.getDate(), m=x.getMonth();
    x.setDate(1); x.setFullYear(x.getFullYear()+n);
    x.setDate(Math.min(day,daysInMonth(x.getFullYear(),m)));
  }
  return x;}
function bounds(c,d){
  const y=d.getFullYear(),m=d.getMonth();
  if(c==='daily')return[new Date(y,m,d.getDate()),new Date(y,m,d.getDate()+1)];
  if(c==='biweekly'){const n=Math.floor((Date.UTC(y,m,d.getDate())-Date.UTC(1970,0,5))/864e5/14);const st=new Date(Date.UTC(1970,0,5)+n*14*864e5);const a=new Date(st.getUTCFullYear(),st.getUTCMonth(),st.getUTCDate());return[a,new Date(a.getFullYear(),a.getMonth(),a.getDate()+14)];}
  if(c==='weekly'){const s=new Date(y,m,d.getDate()-((d.getDay()+6)%7));return[s,new Date(s.getFullYear(),s.getMonth(),s.getDate()+7)];}
  if(c==='monthly')return[new Date(y,m,1),new Date(y,m+1,1)];
  if(c==='quarterly'){const q=Math.floor(m/3)*3;return[new Date(y,q,1),new Date(y,q+3,1)];}
  if(c==='semiannual'){const h=m<6?0:6;return[new Date(y,h,1),new Date(y,h+6,1)];}
  return[new Date(y,0,1),new Date(y+1,0,1)];
}
const elapsed=c=>{const n=new Date(),[a,b]=bounds(c,n);return Math.min(1,(n-a)/(b-a));};
function leftText(c){const n=new Date(),[,b]=bounds(c,n),h=(b-n)/36e5;
  return h<24?Math.max(0,Math.round(h))+'h left':Math.ceil(h/24)+'d left';}

/* ============ data helpers ============ */
const rts=c=>S.routines.filter(r=>r.cadence===c&&!r.archived);
const cnt=(r,k)=>(S.logs[r.id]||{})[k||periodKey(r.cadence,new Date())]||0;
const done=(r,k)=>cnt(r,k)>=(r.target||1);
function periodPct(c){const l=rts(c);if(!l.length)return 0;return l.reduce((a,r)=>a+Math.min(1,cnt(r)/(r.target||1)),0)/l.length;}
function streak(r){let n=0,d=new Date();
  if(!done(r,periodKey(r.cadence,d)))d=shift(r.cadence,d,-1);
  for(let i=0;i<400;i++){if(done(r,periodKey(r.cadence,d))){n++;d=shift(r.cadence,d,-1);}else break;}
  return n;}
function bump(r,dir){
  const k=periodKey(r.cadence,new Date()),t=r.target||1;
  S.logs[r.id]=S.logs[r.id]||{};
  let v=S.logs[r.id][k]||0;
  S.logs[r.id][k]= dir===-1 ? Math.max(0,v-1) : (v>=t?0:v+1);
  save(); render();
}
function step(r,dir){
  const k=periodKey(r.cadence,new Date());
  S.logs[r.id]=S.logs[r.id]||{};
  S.logs[r.id][k]=Math.max(0,(S.logs[r.id][k]||0)+dir);
  save(); render();
}
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();

/* ============ save + sync ============ */
let st=null;
function save(push){
  S.updated=now();
  clearTimeout(st);
  st=setTimeout(async()=>{
    await writeLocal(JSON.stringify(S));
    flash('Saved');
    if(push!==false && local.get(TKEY) && local.get(GKEY) && S.autoSync!==false) pushGist(true);
  },350);
}
function flash(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(flash.t);flash.t=setTimeout(()=>el.classList.remove('on'),1500);}
function pill(txt,cls){const p=document.getElementById('syncpill');p.textContent=txt;p.className='pill '+(cls||'');}

let fbt=null;
function saveFeedback(push){
  FB.updated=now();
  local.set(FBKEY,JSON.stringify(FB));
  clearTimeout(fbt);
  fbt=setTimeout(()=>{
    if(push!==false && local.get(TKEY) && local.get(GKEY) && S.autoSync!==false) pushFeedback(true);
  },350);
}

function merge(a,b){ // b = other state; newer wins on conflicts
  const newer = (b.updated||0) > (a.updated||0) ? b : a, older = newer===a?b:a;
  const out={routines:[],logs:{},metrics:{},goals:[],journal:[],updated:Math.max(a.updated||0,b.updated||0),v:3,autoSync:newer.autoSync!==undefined?newer.autoSync:older.autoSync};
  const byId=(arr)=>Object.fromEntries((arr||[]).map(x=>[x.id,x]));
  ['routines','goals','journal'].forEach(k=>{
    const o=byId(older[k]), n=byId(newer[k]);
    out[k]=Object.values(Object.assign({},o,n));
  });
  out.metrics=Object.assign({},older.metrics||{},newer.metrics||{});
  const ids=new Set([...Object.keys(older.logs||{}),...Object.keys(newer.logs||{})]);
  ids.forEach(id=>{ out.logs[id]=Object.assign({},(older.logs||{})[id]||{},(newer.logs||{})[id]||{}); });
  out.metricView=newer.metricView||older.metricView;
  return out;
}
function mergeFeedback(a,b){
  const newer=(b.updated||0)>(a.updated||0)?b:a, older=newer===a?b:a;
  const byId=arr=>Object.fromEntries((arr||[]).map(x=>[x.id,x]));
  return {updated:Math.max(a.updated||0,b.updated||0), entries:Object.values(Object.assign({},byId(older.entries),byId(newer.entries)))};
}
function latestReport(){
  const list=(RPT&&RPT.reports)||[];
  if(!list.length)return null;
  return list.slice().sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
}
function hasUnseenReport(){
  const r=latestReport(); if(!r)return false;
  return (r.ts||0) > Number(local.get(RPTSEENKEY)||0);
}
function markReportSeen(){
  const r=latestReport(); if(r)local.set(RPTSEENKEY,String(r.ts||0));
}
async function gistFetch(method,body){
  const token=local.get(TKEY), id=local.get(GKEY);
  if(!token||!id) throw new Error('Add your token and gist ID in More first.');
  const res=await fetch('https://api.github.com/gists/'+id,{method,
    headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},
    body:body?JSON.stringify(body):undefined});
  if(!res.ok) throw new Error('GitHub said '+res.status+(res.status===401?' — token rejected':res.status===404?' — gist not found':''));
  return res.json();
}
async function pullGist(quiet){
  try{
    pill('syncing…');
    const g=await gistFetch('GET');
    const f=g.files['cadence.json']||Object.values(g.files)[0];
    let raw=f.truncated? await (await fetch(f.raw_url)).text() : f.content;
    const remote=JSON.parse(raw);
    S=merge(S,remote);
    await writeLocal(JSON.stringify(S));
    const ff=g.files['feedback.json'];
    if(ff){
      try{
        let fraw=ff.truncated? await (await fetch(ff.raw_url)).text() : ff.content;
        FB=mergeFeedback(FB,JSON.parse(fraw));
        local.set(FBKEY,JSON.stringify(FB));
      }catch(e){}
    }
    const rf=g.files['reports.json'];
    if(rf){
      try{
        let rraw=rf.truncated? await (await fetch(rf.raw_url)).text() : rf.content;
        RPT=JSON.parse(rraw)||{reports:[]};
      }catch(e){}
    }
    pill('synced '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),'live');
    if(!(quiet&&isTyping()))render();
    if(!quiet)flash('Pulled from cloud');
  }catch(e){ pill('sync error','off'); if(!quiet)alert(e.message); }
}
function isTyping(){
  const el=document.activeElement, view=document.getElementById('view');

async function askNotify(){
  if(!('Notification' in window))return alert('This browser has no notification support. Use the calendar file instead.');
  const p=await Notification.requestPermission();
  flash(p==='granted'?'Reminders on':'Reminders blocked');
  scheduleAll(); render();
}
function scheduleAll(){
  timers.forEach(clearTimeout); timers=[];
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  S.routines.filter(r=>r.time&&r.cadence==='daily').forEach(r=>{
    const [h,m]=r.time.split(':').map(Number);
    const t=new Date(); t.setHours(h,m,0,0);
    if(t<=new Date())return;
    timers.push(setTimeout(()=>{
      if(done(r))return;
      const opts={body:'Not checked off yet.',icon:'icons/icon-192.png',tag:r.id};
      navigator.serviceWorker?.ready.then(reg=>reg.showNotification(r.name,opts)).catch(()=>new Notification(r.name,opts));
    },t-new Date()));
  });
}
function ics(){
  const dt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Cadence//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Cadence routines'];
  S.routines.filter(r=>!r.archived).forEach(r=>{
    const c=CAD.find(x=>x.id===r.cadence)||CAD[0];
    const [h,m]=(r.time||'08:00').split(':').map(Number);
    const s=new Date(); s.setHours(h,m,0,0);
    const e=new Date(s.getTime()+18e5);
    L.push('BEGIN:VEVENT','UID:'+r.id+'@cadence','DTSTAMP:'+dt(new Date()),'DTSTART:'+dt(s),'DTEND:'+dt(e),
      'RRULE:'+c.rrule,'SUMMARY:'+r.name.replace(/[,;]/g,' '),
      'DESCRIPTION:'+(r.note||'').replace(/\n/g,'\\n').replace(/[,;]/g,' '),
      'BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY','DESCRIPTION:'+r.name.replace(/[,;]/g,' '),'END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

    Windows or Mac: Chrome or Edge, install icon in the address bar.</p></div>

    <div class="panel"><div class="btns"><button class="btn warn" id="reset">Erase everything on this device</button></div></div>`;
}

/* ============ export helpers ============ */
const snapshot=()=>JSON.stringify(S,null,1);
function brief(){
  return `You are my routine coach. Below is my full Cadence tracking file as JSON.

1. Which routines am I actually keeping, and which am I quietly abandoning? Cite the evidence.
2. Correlate Signals (steps, sleep, resting HR, mood, energy) against completion rates. Name what moves what.
3. Where am I overloaded, where is a cadence wrong, and what should I cut?
4. Suggest at most three new routines with cadence and target, and say what each replaces.
5. Return updated JSON in the same structure, keeping all existing ids, so I can paste it back.

\`\`\`json
${snapshot()}
\`\`\``;
}
async function copy(text,msg){
  try{await navigator.clipboard.writeText(text);flash(msg);}
  catch(e){const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();flash(msg);}
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'application/json'}));a.download=name;a.click();
}
function parseRows(txt){
  let n=0;
  txt.split(/\n+/).forEach(line=>{
    const dm=line.match(/(\d{4}-\d{2}-\d{2})/); if(!dm)return;
    const d=dm[1],rec=S.metrics[d]||{};let hit=false;
    METRICS.forEach(([k])=>{const m=line.match(new RegExp(k+'\\D{0,3}(-?[\\d.]+)','i'));if(m){rec[k]=Number(m[1]);hit=true;}});
    if(hit){S.metrics[d]=rec;n++;}
  });
  return n;
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!ready)return; const d=b.dataset;
  if(d.tab){tab=d.tab;if(tab==='feedback')markReportSeen();render();return;}
  if(d.cad){cad=d.cad;render();return;}
  if(d.subtab){insSub=d.subtab;render();return;}
  if(d.tick){bump(S.routines.find(r=>r.id===d.tick),1);return;}
  if(d.plus){step(S.routines.find(r=>r.id===d.plus),1);return;}
  if(d.minus){step(S.routines.find(r=>r.id===d.minus),-1);return;}
  if(d.open){open[d.open]=!open[d.open];render();return;}
  if(d.editrow){editingId=d.editrow;open[d.editrow]=true;render();return;}
  if(d.canceledit){editingId=null;render();return;}
  if(d.saveedit){
    const r=S.routines.find(x=>x.id===d.saveedit),id=d.saveedit;
    r.name=(document.getElementById('e-name-'+id).value||'').trim()||r.name;
    r.cadence=document.getElementById('e-cad-'+id).value;
    r.cat=document.getElementById('e-cat-'+id).value;
    r.target=Math.max(1,parseInt(document.getElementById('e-target-'+id).value)||1);
    r.time=document.getElementById('e-time-'+id).value;
    r.link=document.getElementById('e-link-'+id).value.trim();
    r.img=document.getElementById('e-img-'+id).value.trim();
    r.note=document.getElementById('e-note-'+id).value;
    editingId=null; save(); scheduleAll(); render(); flash('Routine updated');return;}
  if(d.del){if(confirm('Delete this routine and its history?')){S.routines=S.routines.filter(r=>r.id!==d.del);delete S.logs[d.del];if(editingId===d.del)editingId=null;save();render();}return;}
  if(d.mv){S.metricView=d.mv;save();render();return;}
  if(d.gp||d.gm){const g=S.goals.find(x=>x.id===(d.gp||d.gm));g.current=Math.max(0,g.current+(d.gp?1:-1));save();render();return;}
  if(d.gd){S.goals=S.goals.filter(x=>x.id!==d.gd);save();render();return;}
  if(d.jd){S.journal=S.journal.filter(x=>x.id!==d.jd);save();render();return;}
  if(d.fbdel){FB.entries=FB.entries.filter(x=>x.id!==d.fbdel);saveFeedback();render();return;}

  const id=b.id;
  if(id==='add'){
    const name=document.getElementById('n-name').value.trim(); if(!name){flash('Give it a name first');return;}
    S.routines.push({id:uid(),name,cadence:document.getElementById('n-cad').value,cat:document.getElementById('n-cat').value,
      target:Math.max(1,parseInt(document.getElementById('n-target').value)||1),time:document.getElementById('n-time').value,
      link:document.getElementById('n-link').value.trim(),img:document.getElementById('n-img').value.trim(),
      note:document.getElementById('n-note').value,created:iso(new Date())});
    cad=S.routines[S.routines.length-1].cadence; save(); scheduleAll(); render(); flash('Routine added');
  }
  if(id==='savemetric'){
    const d2=iso(new Date()),rec=S.metrics[d2]||{};
    document.querySelectorAll('[data-metric]').forEach(el=>{const v=el.value;if(v==='')delete rec[el.dataset.metric];else rec[el.dataset.metric]=el.type==='number'?Number(v):v;});
    S.metrics[d2]=rec; save(); render(); flash('Numbers saved');
  }
  if(id==='addgoal'){
    const t2=document.getElementById('g-title').value.trim(); if(!t2){flash('Name the goal first');return;}
    S.goals.push({id:uid(),title:t2,metric:document.getElementById('g-metric').value.trim(),target:Number(document.getElementById('g-target').value)||1,current:0,due:document.getElementById('g-due').value});
    save(); render();
  }
  if(id==='addlog'){
    const x=document.getElementById('j-text').value.trim(); if(!x)return;
    S.journal.push({id:uid(),date:iso(new Date()),text:x}); save(); render(); flash('Entry saved');
  }
  if(id==='fb-save'){
    const x=document.getElementById('fb-text').value.trim(); if(!x){flash('Write something first');return;}
    FB.entries.push({id:uid(),text:x,ts:now(),status:'new'}); saveFeedback(); render(); flash('Feedback saved');
  }
  if(id==='copyjson')copy(snapshot(),'Data copied');
  if(id==='copybrief')copy(brief(),'Data and prompt copied');
  if(id==='dl')download('cadence-'+iso(new Date())+'.json',snapshot());
  if(id==='dlics')download('cadence-routines.ics',ics(),'text/calendar');
  if(id==='doimp'){
    const txt=document.getElementById('imp').value.trim(); if(!txt)return;
    if(txt.startsWith('{')){try{const o=JSON.parse(txt);if(!o.routines)throw 0;o.updated=o.updated||now();S=merge(S,o);save();render();flash('File merged');}catch(err){flash('That JSON did not parse');}}
    else{const n=parseRows(txt);save();render();flash(n?n+' days merged':'No dated rows found');}
  }
  if(id==='reset'&&confirm('Erase all routines, history, and notes on this device?')){S={routines:[],logs:{},metrics:{},goals:[],journal:[],updated:now(),v:3};seed();save();render();}
  if(id==='s-save'){
    const g=document.getElementById('s-gist').value.trim(), t=document.getElementById('s-token').value.trim();
    if(g)local.set(GKEY,g); if(t)local.set(TKEY,t);
    S.autoSync=document.getElementById('s-auto').checked;
    save(false); flash('Connection saved'); pullGist();
  }
  if(id==='s-pull')pullGist();
  if(id==='s-push')pushGist();
  if(id==='s-clear'){local.del(TKEY);flash('Token removed from this device');render();}
  if(id==='notif')askNotify();
});
document.addEventListener('change',e=>{ if(e.target.id==='s-auto'){S.autoSync=e.target.checked;save(false);} });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&local.get(TKEY)&&local.get(GKEY))pullGist(true); });

/* ============ boot ============ */
(async function(){
  const raw=await readLocal();
  if(raw){ try{S=Object.assign(S,JSON.parse(raw));}catch(e){} }
  if(!S.routines.length)seed();
  const fbraw=local.get(FBKEY);
  if(fbraw){ try{FB=Object.assign(FB,JSON.parse(fbraw));}catch(e){} }
  ready=true; render(); scheduleAll();
  if(local.get(TKEY)&&local.get(GKEY))pullGist(true); else pill('local only');
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
